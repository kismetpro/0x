# 0x 的 Compose 工程。与原版 ARTEX 的 compose 并存时互不影响：
# 独立的工程名、容器名、数据卷和宿主端口（9887/9888）。
name: 0x

services:
  postgres:
    image: postgres:16-alpine
    container_name: 0x-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zerox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zerox} -d ${POSTGRES_DB:-zerox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  0x:
    image: ${ZEROX_IMAGE:-kismetpro/0x}:${ZEROX_TAG:-latest}
    container_name: 0x
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZEROX_PG_DSN: postgres://${POSTGRES_USER:-zerox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zerox}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZEROX_LLM_PROVIDER: ${ZEROX_LLM_PROVIDER:-}
      ZEROX_LLM_MODEL: ${ZEROX_LLM_MODEL:-}
      ZEROX_LLM_BASE_URL: ${ZEROX_LLM_BASE_URL:-}
      ZEROX_LLM_PROXY: ${ZEROX_LLM_PROXY:-}
    ports:
      - "9887:9887"
      - "127.0.0.1:9888:9888"
    volumes:
      # 把数据目录（含 jwt.key、任务工作区等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
    # 显式卷名，避免与原版 ARTEX 的 pgdata 卷混在一起。
    name: 0x-pgdata
